<!doctype html>
<html lang="en" class="fivey-auth-pending">
<head>
<meta charset="utf-8">
<script src="./theme.js?v=1"></script>
<script src="./entrances.js?v=4"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Questions | Fivey</title>
<link rel="stylesheet" href="./brand.css?v=fb47b45">
<style>
:root{color-scheme:light;--ink:#19271f;--muted:#4e5d52;--paper:#f8f7ef;--line:#d4d9cd;--white:#fffef8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif}
a{color:inherit}
a:focus-visible,summary:focus-visible{outline:3px solid #467335;outline-offset:5px}
.wrap{width:min(1120px,calc(100% - 40px));margin-inline:auto}
header{border-bottom:1px solid var(--line)}
.bar{min-height:70px;display:flex;justify-content:space-between;align-items:center;gap:16px}
nav a{font-size:14px;font-weight:700}
.hero{padding:clamp(40px,8vw,92px) 0;background:var(--ink);color:var(--white)}
h1,h2,p{margin:0}
h1{font-size:clamp(42px,8vw,94px);line-height:1.04;letter-spacing:-.055em}
.tag{display:inline-block;margin-bottom:14px;border-radius:4px;background:var(--tint,#d9f783);color:var(--ink);padding:3px 8px;font:700 13px/1.5 ui-monospace,monospace}
main{flex:1}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-block:34px 72px}
.panel{min-width:0;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:22px}
.panel h2{font-size:23px;margin-bottom:8px;letter-spacing:-.025em}
.panel p,.panel li{color:var(--muted)}
.panel ul{margin:0;padding-left:20px}
.panel li+li{margin-top:10px}
details{padding:12px 0;border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:750}
details p{margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}
#status{padding-top:24px}
footer{border-top:1px solid var(--line);padding:12px 0;font-size:14px;color:var(--muted)}
[hidden]{display:none}
@media(max-width:620px){.columns{grid-template-columns:1fr}}
@view-transition{navigation:auto}
::view-transition-group(root){background:#f8f7ef}
::view-transition-old(root){animation:300ms ease-in both fivey-fade-out;mix-blend-mode:normal}
::view-transition-new(root){animation:400ms ease-out 300ms both fivey-fade-in;mix-blend-mode:normal}
@keyframes fivey-fade-out{from{opacity:1}to{opacity:0}}
@keyframes fivey-fade-in{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){@view-transition{navigation:none}}
.progress{margin-top:24px}
#practice-modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px;max-width:460px}
#practice-unit-list{display:grid;justify-items:start;gap:10px;margin-top:18px}
#practice-modes[hidden],#practice-unit-list[hidden]{display:none}
#practice-modes a{text-align:center}
#mixed-setup{display:grid;gap:14px;max-width:560px;margin-top:18px}
#mixed-setup[hidden],.progress-setup[hidden]{display:none}
#mixed-setup label,#practice-unit-menu label{display:block}
#practice-unit-menu summary{padding:8px 0;cursor:pointer}
#practice-unit-menu label{padding-block:4px}
#mixed-setup button{justify-self:end}
#practice-timer{position:sticky;top:80px;z-index:2;width:max-content;margin:12px 0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--white);font-weight:750;font-variant-numeric:tabular-nums}
#practice-timer[hidden]{display:none}
#progress-check a.practice-button{display:inline-block;padding:8px 12px;text-decoration:none;font-weight:750}
.progress-quiz legend{white-space:pre-line}
.orbies-page-fade{position:fixed;inset:0;z-index:2147483647;background:#d9efff;opacity:0}
</style>
<link rel="stylesheet" href="./fivey-chat.css">
<script type="module" src="./fivey-chat.js?v=6"></script>
<link rel="stylesheet" href="./progress.css?v=3">
<script type="module" src="./progress.js?v=orbies-chest2"></script>
<link rel="stylesheet" href="./auth.css?v=magenta2">
<script type="module" src="./auth-gate.js?v=orbies-chest1"></script>
</head>
<body>
<p id="fivey-access-status" role="status">Checking Fivey sign-in… <a href="./login.html">Go to login</a></p>
<header><div class="wrap bar"><a class="brand" href="./" aria-label="Fivey home"><span class="brand-number" aria-hidden="true">5</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span></a><nav aria-label="Main navigation"><a href="./courses.html" id="practice-back">← All courses</a></nav></div></header>
<main>
<section class="hero" aria-labelledby="title"><div class="wrap"><span class="tag" id="tag" hidden></span><h1 id="title">Practice Questions</h1></div></section>
<p class="wrap" id="status" role="status" hidden></p>
<section class="wrap panel progress" id="progress-check" aria-labelledby="progress-title" hidden>
  <h2 id="progress-title">Progress Checking</h2>
  <p>Practice with original AP-style multiple-choice questions. Submit your set to see your score and explanations.</p>
  <div id="practice-modes" hidden></div>
  <div id="practice-unit-list" hidden></div>
  <form id="mixed-setup" hidden>
    <details id="practice-unit-menu">
      <summary>Choose units</summary>
      <div id="mixed-units"></div>
    </details>
    <div><label for="mixed-count">Multiple-choice questions per set</label><select id="mixed-count" name="count"></select></div>
    <div><label for="mixed-minutes">Time limit</label><select id="mixed-minutes" name="minutes"></select></div>
    <button type="submit">Start My Practice :D</button>
  </form>
  <form class="progress-setup" hidden>
    <label for="progress-size">Questions per set</label>
    <select id="progress-size">
      <option value="5">5 questions</option>
      <option value="10">10 questions</option>
      <option value="15">15 questions</option>
      <option value="20">20 questions</option>
      <option value="25">25 questions</option>
      <option value="30">30 questions</option>
    </select>
    <button type="submit">Start practice</button>
  </form>
  <p class="progress-status" role="status"></p>
  <p id="practice-timer" role="timer" hidden></p>
  <form class="progress-quiz" hidden></form>
</section>
<noscript><p class="wrap">Enable JavaScript to start a practice set.</p></noscript>
</main>
<footer><div class="wrap bar"><span>Fivey · AP study guides and articles</span><a href="https://github.com/Trevor090611/fivey/blob/main/PUBLISHING.md">Add guides or articles</a></div></footer>
<script>
const courses = [
  ['biology', 'AP Biology', 'STEM', '#d9f783'],
  ['environmental-science', 'AP Environmental Science', 'STEM', '#d9f783'],
  ['chemistry', 'AP Chemistry', 'STEM', '#d9f783'],
  ['physics-1', 'AP Physics 1', 'STEM', '#d9f783'],
  ['psychology', 'AP Psychology', 'Humanities', '#fff1b8'],
  ['calculus-ab', 'AP Calculus AB', 'STEM', '#d9f783'],
  ['macroeconomics', 'AP Macroeconomics', 'Humanities', '#fff1b8']
];
const id = new URLSearchParams(location.search).get('course');
const selected = courses.find(([courseId]) => courseId === id);
if (selected) {
  const [, name, category, tint] = selected;
  document.title = name + ' Practice Questions | Fivey';
  const tag = document.querySelector('#tag');
  tag.textContent = name;
  tag.style.setProperty('--tint', tint);
  tag.hidden = false;
  const back = document.querySelector('#practice-back');
  back.href = './course.html?course=' + encodeURIComponent(id);
  back.textContent = '← ' + name;
} else {
  const status = document.querySelector('#status');
  status.textContent = 'Choose a subject from the course library to start practicing.';
  status.hidden = false;
}
</script>
</body>
</html>
