<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find your Fivey account</title>
<script src="./theme.js?v=1"></script>
<link rel="stylesheet" href="./auth.css?v=motion5">
<style>
  .auth-card [hidden] { display: none !important; }
  .auth-card .recovery-step { display: grid; gap: .85rem; }
  .auth-card .recovery-step h2, .auth-card .recovery-step p { margin: 0; }
  .auth-card .recovery-back { display: inline-block; margin-top: .85rem; }
  .auth-card .recovery-actions { display: flex; flex-wrap: wrap; gap: .65rem; }
  .auth-card .recovery-account {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 3rem;
    align-items: center;
    gap: .75rem;
    text-align: left;
    width: 100%;
    overflow-wrap: anywhere;
  }
  .recovery-avatar {
    display: grid;
    place-items: center;
    width: 3rem;
    height: 3rem;
    border: 1px solid currentColor;
    border-radius: 50%;
    overflow: hidden;
  }
  .recovery-account-caption { display: block; font-weight: 400; }
  .auth-card .verified-account {
    box-sizing: border-box;
    padding: .75rem;
    border: 1px solid currentColor;
    border-radius: .5rem;
  }
  .recovery-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .auth-card #recovery-forgot-password {
    justify-self: start;
    width: fit-content;
    padding: .25rem 0;
    border: 0 !important;
    background: transparent !important;
    box-shadow: none;
    color: inherit !important;
    font: inherit;
    font-size: .85rem;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .auth-card #recovery-forgot-password:hover { text-decoration-thickness: 2px; }
  .auth-card #recovery-forgot-password:focus-visible { text-decoration-thickness: 3px; }
</style>
</head>
<body class="fivey-login">
<main class="auth-card">
  <h1>Find your Fivey account</h1>
  <form id="find-account" class="recovery-step">
    <label>Username<input name="username" type="text" autocomplete="username" autocapitalize="none" required maxlength="200"></label>
    <button type="submit">Enter</button>
  </form>
  <section id="select-account" class="recovery-step" hidden>
    <h2>Select your account</h2>
    <button type="button" class="recovery-account" id="account-card">
      <span><strong id="account-username"></strong><span class="recovery-account-caption">Use this username</span></span>
      <span class="recovery-avatar" aria-hidden="true">
        <span id="account-initial"></span>
        <img id="account-public-photo" alt="" referrerpolicy="no-referrer" hidden>
      </span>
    </button>
    <button type="button" id="different-username">Change username</button>
  </section>
  <form id="recovery-login" class="recovery-step" hidden>
    <h2>Enter your password again</h2>
    <p id="selected-username"></p>
    <input name="username" type="hidden" autocomplete="username">
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="button" id="recovery-forgot-password">Forgot Password?</button>
    <button type="submit">Log in</button>
  </form>
  <form id="recovery-reset" class="recovery-step" hidden>
    <h2>Reset your password</h2>
    <p>If this username matches a Fivey account, we can send a reset link to the email on that account.</p>
    <div class="recovery-actions">
      <button type="submit">Send reset link</button>
      <button type="button" id="back-to-password">Back to password</button>
    </div>
  </form>
  <section id="verified-account" class="recovery-step" hidden>
    <h2>You’re signed in</h2>
    <div class="recovery-account verified-account">
      <span><strong id="verified-username"></strong><span class="recovery-account-caption" id="verified-email"></span></span>
      <span class="recovery-avatar" aria-hidden="true">
        <span id="verified-initial"></span>
        <img id="verified-photo" alt="" referrerpolicy="no-referrer" hidden>
      </span>
    </div>
    <button type="button" id="continue-to-fivey">Continue to Fivey</button>
  </section>
  <p id="recovery-status" role="status" aria-live="polite"></p>
  <a class="recovery-back" href="./login.html">Back to log in</a>
  <noscript>Enable JavaScript to recover your account.</noscript>
</main>
<script type="module">
import { authConfig } from './auth-config.js';
import { completed, connect, connectClient, continueToSite, login } from './auth-client.js?v=username-login1';

const findForm = document.querySelector('#find-account');
const selectSection = document.querySelector('#select-account');
const loginForm = document.querySelector('#recovery-login');
const resetForm = document.querySelector('#recovery-reset');
const verifiedSection = document.querySelector('#verified-account');
const card = document.querySelector('#account-card');
const forgotPassword = document.querySelector('#recovery-forgot-password');
const status = document.querySelector('#recovery-status');
let username = '';
let publicPhotoLookup = 0;
let busy = false;

function show(step) {
  for (const section of [findForm, selectSection, loginForm, resetForm, verifiedSection]) section.hidden = section !== step;
  status.textContent = '';
  const field = step.querySelector('input:not([type="hidden"])') || step.querySelector('button');
  field?.focus();
}

function submit(form, action) {
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (busy) return;
    busy = true;
    const controls = [...form.querySelectorAll('button')];
    for (const control of controls) control.disabled = true;
    status.textContent = '';
    try {
      await action(new FormData(form));
    } catch (error) {
      status.textContent = error.message || 'Something went wrong. Please try again.';
    } finally {
      for (const control of controls) control.disabled = false;
      busy = false;
    }
  });
}

function recoveryRequest(phase, details) {
  return fetch(new URL('/functions/v1/recover-fivey-email', authConfig.url), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: authConfig.key },
    cache: 'no-store',
    redirect: 'error',
    body: JSON.stringify({ phase, username, ...details }),
  });
}

async function showPublicPhoto(accountName) {
  const lookup = ++publicPhotoLookup;
  const image = document.querySelector('#account-public-photo');
  const fallback = document.querySelector('#account-initial');
  image.hidden = true;
  image.removeAttribute('src');
  fallback.hidden = false;

  try {
    const response = await fetch(new URL('/rest/v1/rpc/fivey_find_public_photo', authConfig.url), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: authConfig.key },
      cache: 'no-store',
      body: JSON.stringify({ lookup_username: accountName }),
      signal: AbortSignal.timeout(6000),
    });
    if (!response.ok) return;
    const path = await response.json();
    if (lookup !== publicPhotoLookup || typeof path !== 'string' || !/^[a-f0-9]{64}\/avatar\?v=[0-9]+$/.test(path)) return;
    image.src = new URL('/storage/v1/object/public/public-profile-photos/' + path, authConfig.url).href;
    await image.decode();
    if (lookup !== publicPhotoLookup) return;
    image.hidden = false;
    fallback.hidden = true;
  } catch {
    // The initial remains visible when there is no usable public photo.
  }
}

submit(findForm, fields => {
  username = fields.get('username').trim();
  if (!username) throw new Error('Enter your username.');
  document.querySelector('#account-username').textContent = username;
  document.querySelector('#account-initial').textContent = username.slice(0, 1).toUpperCase();
  void showPublicPhoto(username);
  show(selectSection);
});

document.querySelector('#different-username').addEventListener('click', () => show(findForm));

card.addEventListener('click', () => {
  document.querySelector('#selected-username').textContent = username;
  loginForm.elements.username.value = username;
  show(loginForm);
});

forgotPassword.addEventListener('click', () => {
  loginForm.elements.password.value = '';
  show(resetForm);
});

document.querySelector('#back-to-password').addEventListener('click', () => show(loginForm));

async function resetTransport(input, init) {
  const request = new Request(input, init);
  const resetEndpoint = new URL('/auth/v1/recover', authConfig.url);
  const requested = new URL(request.url);
  if (request.method !== 'POST' || requested.origin !== resetEndpoint.origin || requested.pathname !== resetEndpoint.pathname) {
    return fetch(request);
  }
  // Supabase writes the verifier in this tab. The server adds the private account email.
  const body = await request.json();
  return recoveryRequest('reset', { challenge: body.code_challenge });
}

submit(resetForm, async () => {
  const auth = await connect({ fetch: resetTransport });
  if (!auth) throw new Error('Password reset is unavailable. Please try again.');
  const { error } = await auth.resetPasswordForEmail('recovery@example.invalid', { redirectTo: login.href });
  if (error) throw new Error('Could not request a reset link. Please wait a moment and try again.');
  status.textContent = 'If the username matches an account, check its inbox for a reset link. Open it in this same browser tab.';
});

const verifiedPhoto = document.querySelector('#verified-photo');
const verifiedInitial = document.querySelector('#verified-initial');
verifiedPhoto.addEventListener('load', () => {
  verifiedPhoto.hidden = false;
  verifiedInitial.hidden = true;
});
verifiedPhoto.addEventListener('error', () => {
  verifiedPhoto.hidden = true;
  verifiedInitial.hidden = false;
});
document.querySelector('#continue-to-fivey').addEventListener('click', continueToSite);

async function showVerifiedAccount(client, user) {
  const profile = user.user_metadata || {};
  const name = profile.fivey_username || username;
  document.querySelector('#verified-username').textContent = name;
  document.querySelector('#verified-email').textContent = user.email || '';
  verifiedInitial.textContent = name.slice(0, 1).toUpperCase();
  show(verifiedSection);

  const google = user.identities?.find(identity => identity.provider === 'google')?.identity_data;
  let photoUrl = profile.avatar_url || profile.picture || google?.avatar_url || google?.picture;
  if (profile.fivey_avatar_path === user.id + '/avatar') {
    const signed = await client.storage.from('profile-pictures').createSignedUrl(profile.fivey_avatar_path, 120).catch(() => null);
    if (signed?.data?.signedUrl) photoUrl = signed.data.signedUrl;
  }
  if (typeof photoUrl === 'string' && photoUrl.startsWith('https://')) verifiedPhoto.src = photoUrl;
}

submit(loginForm, async fields => {
  const client = await connectClient();
  const auth = client?.auth;
  if (!auth) throw new Error('Fivey sign-in is unavailable. Please try again.');
  let response;
  try {
    response = await recoveryRequest('password', { password: fields.get('password') });
  } catch {
    throw new Error('Fivey could not connect. Please try again.');
  } finally {
    loginForm.elements.password.value = '';
  }
  const result = await response.json().catch(() => ({}));
  if (!response.ok || !result.session) {
    if (response.status === 400) throw new Error('Incorrect username or password. Please try again.');
    throw new Error('Fivey could not log you in. Please try again.');
  }
  const { data, error } = await auth.setSession(result.session);
  if (error || !data.user) throw new Error('Fivey could not open your session. Please try again.');
  if (completed(data.user)) await showVerifiedAccount(client, data.user);
  else location.replace(login.href);
});
</script>
</body>
</html>
