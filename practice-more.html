<!doctype html>
<html lang="en" class="fivey-auth-pending">
<head>
<meta charset="utf-8">
<script src="./theme.js?v=1"></script>
<script src="./entrances.js?v=4"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice More | Fivey</title>
<link rel="stylesheet" href="./brand.css?v=fb47b45">
<link rel="stylesheet" href="./auth.css?v=magenta2">
<style>
:root{color-scheme:light;--ink:#19271f;--muted:#4e5d52;--paper:#f8f7ef;--line:#d4d9cd;--white:#fffef8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif}
a{color:inherit}
.wrap{width:min(960px,calc(100% - 40px));margin-inline:auto}
header{border-bottom:1px solid var(--line)}
.bar{min-height:70px;display:flex;justify-content:space-between;align-items:center;gap:16px}
nav a{font-size:14px;font-weight:700}
main{flex:1;padding-block:clamp(44px,8vw,90px)}
.card{max-width:620px;margin:auto;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:clamp(22px,5vw,40px)}
h1{font-size:clamp(34px,7vw,56px);line-height:1.08;letter-spacing:-.045em;margin:0 0 10px}
p{color:var(--muted);margin:0 0 24px}
label{display:block;font-weight:700;margin:18px 0 7px}
select{width:100%;min-height:48px;padding:10px 12px;border:1px solid #9ba697;border-radius:6px;background:#fff;color:var(--ink);font:inherit}
.practice-button{display:inline-block;margin-top:24px;padding:10px 16px;border:2px solid #34573a;border-radius:6px;background:#fff;color:var(--ink);font:inherit;font-weight:750;text-decoration:none;cursor:pointer;transition:background .22s,color .22s,transform .22s}
.practice-button:hover{background:#d9f783;color:var(--ink);transform:translateY(-5px)}
#status{margin-top:18px;color:#8a3428}
[hidden]{display:none!important}
/* Subject banner above the card (AP Biology uses its photo banner instead). */
.subject-banner{position:relative;overflow:hidden;background:#19271f;color:#fffef8;padding-block:clamp(48px,8vw,88px)}
:root[data-fivey-dark] .subject-banner{background:var(--fivey-navy)}
.subject-banner .wrap{position:relative;z-index:1}
.subject-banner h1{max-width:55%;margin:0;font-size:clamp(36px,6vw,75px);line-height:1.08;color:#fffef8}
:root[data-fivey-dark] .subject-banner[data-category="humanities"] h1{color:#ff4fd8!important}
.hero-banner{position:absolute;top:0;right:0;width:min(64%,960px);height:100%;object-fit:cover;object-position:right center;mask-image:linear-gradient(90deg,transparent 0%,#000 42%);-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 42%);pointer-events:none;user-select:none}
@media(max-width:760px){.subject-banner h1{max-width:none}.hero-banner{width:78%;opacity:.5}}
main[data-category="humanities"],body:has(main[data-category="humanities"]) .fivey-chat{--button-fill:#fff1b8}
:root[data-fivey-dark] body:has(main[data-category="humanities"]) .fivey-chat :is(button,a.practice-button){border-color:#ff4fd8!important;background-image:linear-gradient(#ff4fd8,#ff4fd8)!important}
</style>
<script type="module" src="./auth-gate.js?v=orbies2"></script>
<link rel="stylesheet" href="./biology-banners.css?v=2">
<script type="module" src="./biology-banners.js?v=2"></script>
</head>
<body>
<p id="fivey-access-status" role="status">Checking Fivey sign-in… <a href="./login.html">Go to login</a></p>
<header><div class="wrap bar"><a class="brand" href="./" aria-label="Fivey home"><span class="brand-number" aria-hidden="true">5</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span></a><nav><a id="back-link" href="./courses.html">← Back to analytics</a></nav></div></header>
<section data-biology-banner="review" data-banner-title="title" aria-labelledby="title" hidden><div class="wrap"></div></section>
<main class="wrap"><section class="card" aria-labelledby="title"><h1 id="title">Practice More</h1><p id="description">Choose a unit from your Weakness list and set the number of questions.</p><form id="practice-form"><label for="unit-select">Weakness unit</label><select id="unit-select" required></select><label for="count-select">Questions per set</label><select id="count-select"><option value="5">5 questions</option><option value="10">10 questions</option><option value="15">15 questions</option><option value="20">20 questions</option></select><button class="practice-button" type="submit">Start practice</button></form><p id="status" role="status" hidden></p></section></main>
<script type="module">
import { units } from './practice-units.js?v=5';
const courses={biology:'AP Biology','environmental-science':'AP Environmental Science',chemistry:'AP Chemistry','physics-1':'AP Physics 1',psychology:'AP Psychology','calculus-ab':'AP Calculus AB',macroeconomics:'AP Macroeconomics'};
const params=new URLSearchParams(location.search);
const course=params.get('course');
if (['psychology', 'macroeconomics'].includes(course)) document.querySelector('main').dataset.category = 'humanities';
// Subject banner illustration; AP Biology has its own photo banner (biology-banners.js).
if (Object.hasOwn(courses, course) && course !== 'biology') {
  const section = document.querySelector('[data-biology-banner]');
  const banner = Object.assign(document.createElement('img'), { className: 'hero-banner', src: './banners/' + course + '-review.svg', alt: '', decoding: 'async' });
  banner.setAttribute('aria-hidden', 'true');
  section.classList.add('subject-banner');
  if (['psychology', 'macroeconomics'].includes(course)) section.dataset.category = 'humanities';
  section.prepend(banner);
  section.querySelector('.wrap').append(document.getElementById('title'));
  section.hidden = false;
}
const allowed=Array.isArray(units?.[course])?units[course]:[];
const requested=[...new Set((params.get('units')||'').split(',').map(Number).filter(Number.isInteger))].filter(id=>id>0&&id<=allowed.length);
const unitSelect=document.querySelector('#unit-select');
const status=document.querySelector('#status');
const countSelect=document.querySelector('#count-select');
const name=courses[course];
if(!name||!requested.length){status.textContent='No units are in your Weakness list. Units averaging 50% or below appear there.';status.hidden=false;document.querySelector('#practice-form').hidden=true;}
else{
 document.title='Practice More · '+name+' | Fivey';
 document.querySelector('#title').textContent='Practice More';
 document.querySelector('#description').textContent='Choose a unit from your '+name+' Weakness list and set the number of questions.';
 document.querySelector('#back-link').href='./course.html?'+new URLSearchParams({course,view:'analytics'});
 for(const id of requested){const option=document.createElement('option');option.value=String(id);option.textContent='Unit '+id+': '+allowed[id-1];unitSelect.append(option);}
 if(requested.includes(Number(params.get('unit'))))unitSelect.value=params.get('unit');
 if([...countSelect.options].some(option=>option.value===params.get('count')))countSelect.value=params.get('count');
}
document.querySelector('#practice-form').addEventListener('submit',event=>{event.preventDefault();if(!unitSelect.value)return;location.assign('./practice.html?'+new URLSearchParams({course,mode:'set',from:'more',units:requested.join(','),unit:unitSelect.value,count:countSelect.value,run:crypto.randomUUID()}));});
</script>
</body>
</html>
