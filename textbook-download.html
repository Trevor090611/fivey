<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Textbook Download | Fivey</title>
<link rel="stylesheet" href="./auth.css?v=8643d4f">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f7ef;color:#19271f;font:16px/1.55 system-ui,sans-serif}
  main{box-sizing:border-box;width:min(560px,calc(100% - 32px));padding:24px;background:#fffef8;border:1px solid #d4d9cd;border-radius:10px}
  [hidden]{display:none!important}
  h1{margin:0;font-size:1.6rem}
  .practice-button{display:inline-block;padding:8px 12px;border-radius:6px;font-weight:750;text-decoration:none}
</style>
</head>
<body>
<main>
  <h1>Textbook Download</h1>
  <p id="download-status" role="status">Choose a textbook from your course’s Resources page.</p>
  <a id="download-pdf" class="practice-button" hidden>Download PDF manually</a>
</main>
<script>
const textbookDownloads = {
  'environmental-science': 'https://github.com/Trevor090611/fivey/releases/download/apes-textbook-2015/Rick-Relyea-Andrew-Friedland-Environmental-Science-for-AP-WH-Freeman-2015.pdf',
  chemistry: 'https://github.com/Trevor090611/fivey/releases/download/ap-chemistry-textbook-4e/Chemistry.A.Molecular.Approach.4e.by.Nivaldo.Tro.pdf',
};

const course = new URLSearchParams(location.search).get('course');
if (Object.hasOwn(textbookDownloads, course)) {
  const url = textbookDownloads[course];
  document.querySelector('#download-status').textContent = 'the PDF version of this textbook is being downloaded into your computer';
  const retry = document.querySelector('#download-pdf');
  retry.href = url;
  retry.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const download = document.createElement('iframe');
    download.hidden = true;
    download.title = 'Textbook PDF download';
    download.src = url;
    document.body.append(download);
  }));
}
</script>
</body>
</html>
