<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Textbook Download | Fivey</title>
<link rel="stylesheet" href="./auth.css?v=8643d4f">
<style>
  body{position:relative;isolation:isolate;margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f7ef;color:#19271f;font:16px/1.55 system-ui,sans-serif}
  main{grid-area:1/1;box-sizing:border-box;width:min(560px,calc(100% - 32px));padding:24px;background:#fffef8;border:1px solid #d4d9cd;border-radius:10px}
  [hidden]{display:none!important}
  h1{margin:0;font-size:1.6rem}
  .practice-button{display:inline-block;padding:8px 12px;border-radius:6px;font-weight:750;text-decoration:none}
.download-backdrop{
  position:absolute;
  inset:0;
  z-index:-1;
  isolation:isolate;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 90%,#0005,transparent 68%),
    radial-gradient(ellipse at 8% 110%,color-mix(in srgb,var(--hero-glow,#386553) 55%,transparent),transparent 59%),
    radial-gradient(ellipse at 95% 0%,color-mix(in srgb,var(--hero-glow,#386553) 76%,transparent),transparent 57%),
    var(--hero-base,#19271f);
}
.download-backdrop::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:var(--hero-texture,none);
  background-size:var(--hero-texture-size,auto);
  background-position:center;
  mask-image:linear-gradient(90deg,#000 0%,transparent 39%,transparent 61%,#000 100%);
  pointer-events:none;
}
.hero-art{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:space-between;
  overflow:hidden;
  pointer-events:none;
  user-select:none;
}
.hero-art img{
  width:37%;
  height:100%;
  min-width:0;
  object-fit:cover;
  opacity:.46;
  filter:saturate(.7) brightness(.82);
}
.hero-art img:first-child{
  mask-image:linear-gradient(90deg,#000 24%,transparent 97%);
}
.hero-art img:last-child{
  mask-image:linear-gradient(270deg,#000 24%,transparent 97%);
}
.download-backdrop[data-course="environmental-science"]{
  --hero-base:#142517;--hero-glow:#75944d;--hero-accent:#d9edac;
  --hero-texture:repeating-radial-gradient(ellipse at 95% 100%,transparent 0 17px,#ddeda62f 18px 19px,transparent 20px 29px);
  --hero-texture-size:100% 100%;
}
.download-backdrop[data-course="chemistry"]{
  --hero-base:#191a35;--hero-glow:#7953a4;--hero-accent:#dac1f5;
  --hero-texture:radial-gradient(circle,#dac1f54d 1px,transparent 2px);
  --hero-texture-size:22px 22px;
}
.download-backdrop[data-course="physics-1"]{
  --hero-base:#101e39;--hero-glow:#3e72ac;--hero-accent:#bad9ff;
  --hero-texture:repeating-linear-gradient(-24deg,transparent 0 19px,#bad9ff30 20px 21px,transparent 22px 37px);
  --hero-texture-size:100% 100%;
}
.download-backdrop[data-course="psychology"] .hero-art img{
  object-fit:contain;
  mask-image:radial-gradient(ellipse,#000 28%,transparent 73%);
}
.download-backdrop[data-course="psychology"] .hero-art img:first-child{object-position:left center}
.download-backdrop[data-course="psychology"] .hero-art img:last-child{object-position:right center}
.download-backdrop[data-course="psychology"]{
  --hero-base:#281a32;--hero-glow:#a65379;--hero-accent:#f4bccf;
  --hero-texture:repeating-radial-gradient(ellipse at 0 80%,transparent 0 22px,#f4bccf27 23px 24px,transparent 25px 40px);
  --hero-texture-size:100% 100%;
}
@media(max-width:760px){.hero-art img{width:42%;opacity:.34}}
body:has(.download-backdrop[data-course="environmental-science"]){background:#142517}
body:has(.download-backdrop[data-course="chemistry"]){background:#191a35}
.hero-equations{
  position:absolute;
  inset:8px clamp(12px,4vw,66px);
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  grid-template-rows:42px 1fr 42px;
  align-items:center;
  justify-items:center;
  pointer-events:none;
  user-select:none;
  color:color-mix(in srgb,var(--hero-accent,#fff) 43%,transparent);
  font:500 clamp(12px,1.52vw,22px)/1.15 Georgia,serif;
  white-space:nowrap;
}
.hero-equations span{rotate:var(--angle);translate:var(--offset-x) var(--offset-y);scale:var(--size)}
.hero-equations span:nth-child(n+6){grid-row:3}
@media(max-width:760px){
  .hero-equations{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:22px 22px 1fr 22px 22px}
  .hero-equations span{translate:0 var(--offset-y)}
  .hero-equations span:nth-child(5),.hero-equations span:nth-child(6){grid-row:4}
  .hero-equations span:nth-child(7),.hero-equations span:nth-child(8){grid-row:5}
  .hero-equations span:nth-child(n+9){display:none}
}
#chemistry-credits{position:absolute;inset:auto 12px 0;margin:0;padding:8px;text-align:center;color:#fffef8;font-size:12px}
#chemistry-credits a{color:inherit}
</style>
</head>
<body>
<div class="download-backdrop" aria-hidden="true" hidden>
  <div class="hero-equations"></div>
</div>
<template id="environmental-science-art"><div class="hero-art" aria-hidden="true">
  <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/Marsh_at_National_wildlife_Refuge.jpg" alt="" decoding="async" referrerpolicy="no-referrer">
  <img src="https://upload.wikimedia.org/wikipedia/commons/0/0d/Mississippi_River_Delta_%28MODIS_2024-04-01%29.jpg" alt="" decoding="async" referrerpolicy="no-referrer">
</div></template>
<template id="chemistry-art"><div class="hero-art" aria-hidden="true">
  <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Test_tubes_in_a_laboratory.jpg/960px-Test_tubes_in_a_laboratory.jpg" alt="" decoding="async" referrerpolicy="no-referrer">
  <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a6/Copper_Sulfate_Crystal.jpg/960px-Copper_Sulfate_Crystal.jpg" alt="" decoding="async" referrerpolicy="no-referrer">
</div></template>
<template id="physics-1-art"><div class="hero-art" aria-hidden="true">
  <!-- Apollo 15 hammer and feather experiment and X-66 wind-tunnel testing, NASA via Wikimedia Commons. -->
  <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8d/Apollo_15_F%26H.jpg/500px-Apollo_15_F%26H.jpg" alt="" decoding="async" referrerpolicy="no-referrer">
  <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/9/95/Wind_Over_Its_Wing-_NASA%E2%80%99s_X-66_Model_Tests_Airflow_%28ACD24-0108-010%29.jpg/960px-Wind_Over_Its_Wing-_NASA%E2%80%99s_X-66_Model_Tests_Airflow_%28ACD24-0108-010%29.jpg" alt="" decoding="async" referrerpolicy="no-referrer">
</div></template>
<template id="psychology-art"><div class="hero-art" aria-hidden="true">
  <!-- Public-domain fMRI image and CC0 Rubin vase illustration from Wikimedia Commons. -->
  <img src="https://upload.wikimedia.org/wikipedia/commons/3/3b/MRI_brain.jpg" alt="" decoding="async" referrerpolicy="no-referrer">
  <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9b/Two_silhouette_profile_or_a_white_vase.svg/960px-Two_silhouette_profile_or_a_white_vase.svg.png" alt="" decoding="async" referrerpolicy="no-referrer">
</div></template>
<main>
  <h1>Textbook Download</h1>
  <p id="download-status" role="status">Choose a textbook from your course’s Resources page.</p>
  <a id="download-pdf" class="practice-button" hidden>Download PDF manually</a>
</main>
<p id="chemistry-credits" hidden>Banner photos (cropped and tinted), <a href="https://commons.wikimedia.org/wiki/File:Test_tubes_in_a_laboratory.jpg">Sarka Na kopci</a> and <a href="https://commons.wikimedia.org/wiki/File:Copper_Sulfate_Crystal.jpg">Crystal Titan</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.</p>
<script>
const textbookDownloads = {
  psychology: 'https://github.com/Trevor090611/fivey/releases/download/ap-psychology-textbook-4e/Myers-Psychology-for-the-AP-Course-4th-Edition.pdf',
  'physics-1': 'https://github.com/Trevor090611/fivey/releases/download/ap-physics-1-textbook-10e/Fundamentals.of.Physics.10e.pdf',
  'environmental-science': 'https://github.com/Trevor090611/fivey/releases/download/apes-textbook-2015/Rick-Relyea-Andrew-Friedland-Environmental-Science-for-AP-WH-Freeman-2015.pdf',
  chemistry: 'https://github.com/Trevor090611/fivey/releases/download/ap-chemistry-textbook-4e/Chemistry.A.Molecular.Approach.4e.by.Nivaldo.Tro.pdf',
};

const courseEquations = {
  "psychology": ["ΔI / I = k","z = (x − μ) / σ","x̄ = Σx / n","σ² = Σ(x − μ)² / N","σ = √σ²","r² = r × r","range = max − min","IQR = Q₃ − Q₁","SE = s / √n","P(Aᶜ) = 1 − P(A)"],
  "physics-1": ["ΣF = ma","K = ½mv²","p = mv","J = Δp","W = Fd cos θ","τ = rF sin θ","a = v² / r","Uₛ = ½kx²","v = v₀ + at","T = 2π√(m/k)"],
  "environmental-science": ["NPP = GPP − R","ΔN = B + I − D − E","GPP = NPP + R","P = E / t","E = Pt","D = N / A","η = Eₒᵤₜ / Eᵢₙ","CO₂ + H₂O ⇌ H₂CO₃","ΔT = T₂ − T₁","r = ΔN / Δt"],
  "chemistry": ["PV = nRT","pH = −log₁₀[H⁺]","pH + pOH = 14 (25 °C)","q = mcΔT","ΔG = ΔH − TΔS","A = εℓc","M = n / V","λν = c","E = hν","ΔG° = −RT ln K"],
};

const course = new URLSearchParams(location.search).get('course');
if (Object.hasOwn(textbookDownloads, course)) {
  const backdrop = document.querySelector('.download-backdrop');
  backdrop.dataset.course = course;
  backdrop.prepend(document.getElementById(course + '-art').content.cloneNode(true));
  const equationLayer = backdrop.querySelector('.hero-equations');
  for (const formula of courseEquations[course]) {
    const equation = document.createElement('span');
    equation.textContent = formula;
    equationLayer.append(equation);
  }
  backdrop.hidden = false;
  document.querySelector('#chemistry-credits').hidden = course !== 'chemistry';
  const url = textbookDownloads[course];
  const status = document.querySelector('#download-status');
  status.textContent = 'By clicking the button below, the PDF version of the textbook will be downloaded to your computer.';
  const retry = document.querySelector('#download-pdf');
  retry.href = url;
  retry.hidden = false;
  retry.addEventListener('click', () => {
    status.textContent = 'the PDF version of this textbook is being downloaded into your computer';
  });
}
</script>
</body>
</html>
