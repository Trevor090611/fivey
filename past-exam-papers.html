<!doctype html>
<html lang="en" class="fivey-auth-pending">
<head>
<meta charset="utf-8">
<script src="./theme.js?v=1"></script>
<script src="./entrances.js?v=4"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Past Exam Papers | Fivey</title>
<link rel="stylesheet" href="./brand.css?v=fb47b45">
<style>
:root{color-scheme:light;--ink:#19271f;--muted:#4e5d52;--paper:#f8f7ef;--line:#d4d9cd;--white:#fffef8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif}
a{color:inherit}
a:focus-visible{outline:3px solid #467335;outline-offset:5px}
.wrap{width:min(1120px,calc(100% - 40px));margin-inline:auto}
header{border-bottom:1px solid var(--line)}
.bar{min-height:70px;display:flex;justify-content:space-between;align-items:center;gap:16px}
nav a{font-size:14px;font-weight:700}
.hero{padding:clamp(40px,8vw,92px) 0;background:var(--ink);color:var(--white)}
.hero{position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1}
.hero-banner{position:absolute;top:0;right:0;width:min(64%,960px);height:100%;object-fit:cover;object-position:right center;mask-image:linear-gradient(90deg,transparent 0%,#000 42%);-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 42%);pointer-events:none;user-select:none}
.hero.has-banner h1{max-width:55%}
@media(max-width:760px){.hero.has-banner h1{max-width:none}.hero-banner{width:78%;opacity:.5}}
h1,h2,p{margin:0}
h1{font-size:clamp(42px,8vw,94px);line-height:1.04;letter-spacing:-.055em}
.tag{display:inline-block;margin-bottom:14px;border-radius:4px;background:var(--tint,#d9f783);color:var(--ink);padding:3px 8px;font:700 13px/1.5 ui-monospace,monospace}
main{flex:1}
#intro{padding-top:34px}
#intro p{max-width:760px;color:var(--muted)}
.years{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-block:22px 72px}
.year{min-width:0;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:22px}
.year h2{font-size:30px;line-height:1.1;letter-spacing:-.03em}
.sets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:6px}
.sets h3{margin:0;font-size:17px;letter-spacing:-.01em}
.sets .year-actions{margin-top:10px}
.year .no-key{flex-basis:100%;margin:0;color:var(--muted);font-size:14px}
main[data-category="humanities"],body:has(main[data-category="humanities"]) .fivey-chat{--button-fill:#fff1b8}
:root[data-fivey-dark] body:has(main[data-category="humanities"]) .fivey-chat :is(button,a.practice-button){border-color:#ff4fd8!important;background-image:linear-gradient(#ff4fd8,#ff4fd8)!important}
.year-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.year-actions .practice-button{display:inline-block;padding:8px 12px;border-radius:6px;font-weight:750;text-decoration:none}
#status{padding-block:34px 72px}
[hidden]{display:none}
@view-transition{navigation:auto}
::view-transition-group(root){background:#f8f7ef}
::view-transition-old(root){animation:300ms ease-in both fivey-fade-out;mix-blend-mode:normal}
::view-transition-new(root){animation:400ms ease-out 300ms both fivey-fade-in;mix-blend-mode:normal}
@keyframes fivey-fade-out{from{opacity:1}to{opacity:0}}
@keyframes fivey-fade-in{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){@view-transition{navigation:none}}
</style>
<link rel="stylesheet" href="./fivey-chat.css?v=15">
<script type="module" src="./fivey-chat.js?v=24"></script>
<link rel="stylesheet" href="./auth.css?v=magenta2">
<script type="module" src="./auth-gate.js?v=orbies-chest1"></script>
<link rel="stylesheet" href="./biology-banners.css?v=2">
<script type="module" src="./biology-banners.js?v=2"></script>
</head>
<body>
<p id="fivey-access-status" role="status">Checking Fivey sign-in… <a href="./login.html">Go to login</a></p>
<header><div class="wrap bar"><a class="brand" href="./" aria-label="Fivey home"><span class="brand-number" aria-hidden="true">5</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span></a><nav aria-label="Main navigation"><a href="./courses.html?tool=exams" id="back">← All courses</a></nav></div></header>
<main>
<section class="hero" data-biology-banner="past-exams" aria-labelledby="title"><div class="wrap"><span class="tag" id="tag" hidden></span><h1 id="title">Past Exam Papers</h1></div></section>
<div class="wrap" id="intro" hidden><p>Official free-response questions and their scoring guidelines, released by the College Board. Each button opens the PDF in a new tab, where you can read or download it.</p></div>
<div class="wrap years" id="years" hidden></div>
<p class="wrap" id="status" role="status" hidden></p>
<noscript><p class="wrap">Enable JavaScript to view past exam papers for this course.</p></noscript>
</main>
<script>
const courses = [
  ['biology', 'AP Biology', '#d9f783'],
  ['environmental-science', 'AP Environmental Science', '#d9f783'],
  ['chemistry', 'AP Chemistry', '#d9f783'],
  ['physics-1', 'AP Physics 1', '#d9f783'],
  ['psychology', 'AP Psychology', '#fff1b8'],
  ['calculus-ab', 'AP Calculus AB', '#d9f783'],
  ['macroeconomics', 'AP Macroeconomics', '#fff1b8']
];
// Years the College Board currently publishes on AP Central, newest first.
const years = [2026, 2025, 2024, 2023];
// Years where a course's exam had two free-response sets (Set 1 and Set 2).
const twoSets = {
  'environmental-science': [2021, 2022, 2023, 2024, 2025],
  psychology: [2019, 2021, 2023, 2024, 2025],
  macroeconomics: [2019, 2021, 2022, 2023, 2024, 2025]
};
// Years with a main exam and an alternate exam (Form A and Form B).
const formB = {
  biology: [2002, 2005, 2006, 2007, 2008, 2009, 2010, 2011],
  chemistry: [2011],
  macroeconomics: [2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011]
};
// Exams (sets or forms) left off the site because their question paper and answer key don't both exist.
const missingExams = {
  biology: { 2005: ['Form A'] },
  psychology: { 2021: ['Set 2'] }
};
// Hosted years whose answer key is not available anywhere.
const noAnswerKey = {
  macroeconomics: [2001]
};

// Older years that AP Central no longer hosts, kept in this site's past-exams folder
// as past-exams/<course>/<year>-question-paper.pdf and <year>-answer-key.pdf
// (<year>-set-<n>-... for years with two sets, <year>-form-b-... for Form B).
const hostedYears = {
  biology: [2022, 2021, 2019, 2018, 2017, 2016, 2015, 2014, 2013, 2012, 2011, 2010, 2009, 2008, 2007, 2006,
    2005, 2002, 2001, 2000],
  chemistry: [2022, 2021, 2019, 2018, 2017, 2016, 2015, 2014, 2013, 2012, 2011, 2010, 2009, 2008, 2007, 2006,
    2005, 2004],
  'environmental-science': [2022, 2021, 2019, 2018, 2017, 2016, 2015, 2014, 2013, 2012, 2011, 2010],
  'calculus-ab': [2022, 2021, 2019, 2018, 2017, 2016, 2015, 2014, 2013],
  'physics-1': [2022, 2021, 2019, 2018, 2017, 2016, 2015],
  macroeconomics: [2022, 2021, 2019, 2018, 2017, 2016, 2015, 2014, 2013, 2012, 2011, 2010, 2009, 2008,
    2007, 2006, 2005, 2004, 2003, 2002, 2001, 2000, 1999],
  psychology: [2021, 2019, 2018, 2016, 2015, 2014, 2011, 2009, 2008, 2007, 2006, 2005, 2004, 2003]
};

// The exams given in a year, as [file suffix, label]: one exam, Set 1 and Set 2, or Form A and Form B.
function exams(course, year) {
  const missing = missingExams[course]?.[year] || [];
  if (twoSets[course]?.includes(year)) return [['-set-1', 'Set 1'], ['-set-2', 'Set 2']].filter(([, label]) => !missing.includes(label));
  if (formB[course]?.includes(year)) return [['', 'Form A'], ['-form-b', 'Form B']].filter(([, label]) => !missing.includes(label));
  return [['', '']];
}

// kind is 'frq' (the question paper) or 'sg' (the scoring guidelines, i.e. the answer key).
function pdf(kind, course, year, suffix) {
  if (hostedYears[course]?.includes(year)) {
    return './past-exams/' + course + '/' + year + suffix + (kind === 'frq' ? '-question-paper' : '-answer-key') + '.pdf';
  }
  return 'https://apcentral.collegeboard.org/media/pdf/ap' + String(year).slice(2) + '-' + kind + '-' + course + suffix + '.pdf';
}

function button(label, href, description) {
  const link = document.createElement('a');
  link.className = 'practice-button';
  link.href = href;
  link.target = '_blank';
  link.rel = 'noopener';
  link.textContent = label;
  link.setAttribute('aria-label', label + ', ' + description + ' (PDF, opens in a new tab)');
  return link;
}

function actions(course, year, suffix, description) {
  const row = document.createElement('div');
  row.className = 'year-actions';
  row.append(button('Question Paper', pdf('frq', course, year, suffix), description));
  if (noAnswerKey[course]?.includes(year)) {
    row.append(Object.assign(document.createElement('p'), { className: 'no-key', textContent: 'No answer key is available for this year.' }));
  } else {
    row.append(button('Answer Key', pdf('sg', course, year, suffix), description));
  }
  return row;
}

// One box per year. Years with two exams show them side by side (Set 1 and Set 2, or Form A and Form B).
function yearBox(course, name, year) {
  const box = document.createElement('section');
  box.className = 'year';
  const title = document.createElement('h2');
  title.textContent = year;
  box.append(title);
  const list = exams(course, year);
  if (list.length > 1 || list[0][1]) {
    const sets = document.createElement('div');
    sets.className = 'sets';
    for (const [suffix, text] of list) {
      const group = document.createElement('div');
      const label = document.createElement('h3');
      label.textContent = text;
      group.append(label, actions(course, year, suffix, name + ' ' + year + ' ' + text));
      sets.append(group);
    }
    box.append(sets);
    for (const label of missingExams[course]?.[year] || []) {
      box.append(Object.assign(document.createElement('p'), { className: 'no-key', textContent: label + ' is not available for this year.' }));
    }
  } else {
    box.append(actions(course, year, '', name + ' ' + year));
  }
  return box;
}

const id = new URLSearchParams(location.search).get('course');
const selected = courses.find(([courseId]) => courseId === id);
if (selected) {
  const [, name, tint] = selected;
  // Subject banner illustration (AP Biology has its own photo banners).
  if (id !== 'biology') {
    const banner = Object.assign(document.createElement('img'), { className: 'hero-banner', src: './banners/' + id + '-past-exams.svg', alt: '', decoding: 'async' });
    banner.setAttribute('aria-hidden', 'true');
    document.querySelector('.hero').prepend(banner);
    document.querySelector('.hero').classList.add('has-banner');
  }
  if (['psychology', 'macroeconomics'].includes(id)) document.querySelector('main').dataset.category = 'humanities';
  document.title = name + ' Past Exam Papers | Fivey';
  const tag = document.querySelector('#tag');
  tag.textContent = name;
  tag.style.setProperty('--tint', tint);
  tag.hidden = false;
  const back = document.querySelector('#back');
  back.href = './full-length.html?course=' + encodeURIComponent(id);
  back.textContent = '← Full Length Practice Test';
  const list = document.querySelector('#years');
  // Every subject uses the wide, two-per-row year boxes.
  for (const year of [...years, ...(hostedYears[id] || [])]) list.append(yearBox(id, name, year));
  document.querySelector('#intro').hidden = false;
  list.hidden = false;
} else {
  const status = document.querySelector('#status');
  status.textContent = 'Choose a subject from the course library to view its past exam papers.';
  status.hidden = false;
}
</script>
</body>
</html>
