<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course | Fivey</title>
<link rel="stylesheet" href="./brand.css">
<style>
:root{color-scheme:light;--ink:#19271f;--muted:#4e5d52;--paper:#f8f7ef;--line:#d4d9cd;--white:#fffef8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif}
a{color:inherit}
a:focus-visible,summary:focus-visible{outline:3px solid #467335;outline-offset:5px}
.wrap{width:min(1120px,calc(100% - 40px));margin-inline:auto}
header{border-bottom:1px solid var(--line)}
.bar{min-height:70px;display:flex;justify-content:space-between;align-items:center;gap:16px}
nav a{font-size:14px;font-weight:700}
.hero{padding:clamp(40px,8vw,92px) 0;background:var(--ink);color:var(--white)}
h1,h2,p{margin:0}
h1{font-size:clamp(42px,8vw,94px);line-height:1.04;letter-spacing:-.055em}
.tag{display:inline-block;margin-bottom:14px;border-radius:4px;background:var(--tint,#d9f783);color:var(--ink);padding:3px 8px;font:700 13px/1.5 ui-monospace,monospace}
main{flex:1}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-block:34px 72px}
.panel{min-width:0;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:22px}
.panel h2{font-size:23px;margin-bottom:8px;letter-spacing:-.025em}
.panel p,.panel li{color:var(--muted)}
.panel ul{margin:0;padding-left:20px}
.panel li+li{margin-top:10px}
details{padding:12px 0;border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:750}
details p{margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}
#status{padding-top:24px}
footer{border-top:1px solid var(--line);padding:12px 0;font-size:14px;color:var(--muted)}
[hidden]{display:none}
@media(max-width:620px){.columns{grid-template-columns:1fr}}
@view-transition{navigation:auto}
::view-transition-group(root){background:#f8f7ef}
::view-transition-old(root){animation:300ms ease-in both fivey-fade-out;mix-blend-mode:normal}
::view-transition-new(root){animation:400ms ease-out 300ms both fivey-fade-in;mix-blend-mode:normal}
@keyframes fivey-fade-out{from{opacity:1}to{opacity:0}}
@keyframes fivey-fade-in{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){@view-transition{navigation:none}}
</style>
<link rel="stylesheet" href="./fivey-chat.css">
<script type="module" src="./fivey-chat.js?v=4"></script>
<link rel="stylesheet" href="./progress.css?v=3">
<script type="module" src="./progress.js?v=4"></script>
</head>
<body>
<header><div class="wrap bar"><a class="brand" href="./" aria-label="Fivey home"><span class="brand-number" aria-hidden="true">5</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span></a><nav aria-label="Main navigation"><a href="./courses.html">← All courses</a></nav></div></header>
<main>
<section class="hero" aria-labelledby="title"><div class="wrap"><span class="tag" id="tag" hidden></span><h1 id="title">Course</h1></div></section>
<p class="wrap" id="status" role="status" hidden></p>
<div class="wrap columns" id="resources" hidden>
<section class="panel" aria-labelledby="guides-title"><h2 id="guides-title">Study Guides</h2><div id="guides"></div></section>
<section class="panel" aria-labelledby="articles-title"><h2 id="articles-title">How I Studied for a 5</h2><div id="articles"></div></section>
</div>
<section class="wrap panel progress" id="progress-check" aria-labelledby="progress-title" hidden>
  <h2 id="progress-title">Progress Checking</h2>
  <p>Practice with original AP-style multiple-choice questions. Submit your set to see your score and explanations.</p>
  <form class="progress-setup">
    <label for="progress-size">Questions per set</label>
    <select id="progress-size">
      <option value="5">5 questions</option>
      <option value="10">10 questions</option>
      <option value="15">15 questions</option>
      <option value="20">20 questions</option>
      <option value="25">25 questions</option>
      <option value="30">30 questions</option>
    </select>
    <button type="submit">Start practice</button>
  </form>
  <p class="progress-status" role="status"></p>
  <form class="progress-quiz" hidden></form>
</section>
<noscript><p class="wrap">Enable JavaScript to view this course.</p></noscript>
</main>
<footer><div class="wrap bar"><span>Fivey · AP study guides and articles</span><a href="https://github.com/Trevor090611/fivey/blob/main/PUBLISHING.md">Add guides or articles</a></div></footer>
<script>
const courses = [
  ['biology', 'AP Biology', 'STEM', '#d9f783'],
  ['chemistry', 'AP Chemistry', 'STEM', '#d9f783'],
  ['physics-1', 'AP Physics 1', 'STEM', '#d9f783'],
  ['psychology', 'AP Psychology', 'Humanities', '#fff1b8'],
  ['calculus-ab', 'AP Calculus AB', 'STEM', '#d9f783'],
  ['macroeconomics', 'AP Macroeconomics', 'Humanities', '#fff1b8']
];

function element(tag, text) {
  const node = document.createElement(tag);
  node.textContent = text;
  return node;
}

function showStatus(message) {
  const status = document.querySelector('#status');
  status.textContent = message;
  status.hidden = false;
}

function guideLink(entry) {
  if (typeof entry?.title !== 'string' || typeof entry.url !== 'string') return null;
  try {
    const url = new URL(entry.url, document.baseURI);
    if (!['https:', 'http:'].includes(url.protocol)) return null;
    const link = element('a', entry.title);
    link.href = url.href;
    return link;
  } catch {
    return null;
  }
}

async function loadResources(id) {
  const response = await fetch('./library.json');
  if (!response.ok) throw new Error('Could not load the resource library');
  const library = await response.json();
  const course = library[id] ?? {};
  const guides = document.querySelector('#guides');
  const articles = document.querySelector('#articles');
  const links = (course.guides ?? []).map(guideLink).filter(Boolean);
  if (links.length) {
    const list = document.createElement('ul');
    for (const link of links) {
      const item = document.createElement('li');
      item.append(link);
      list.append(item);
    }
    guides.append(list);
  } else {
    guides.append(element('p', 'No study guides posted yet.'));
  }
  const posts = course.articles ?? [];
  if (!posts.length) articles.append(element('p', 'No articles posted yet.'));
  for (const post of posts) {
    const details = document.createElement('details');
    details.append(element('summary', post.title));
    for (const paragraph of post.paragraphs) {
      details.append(element('p', paragraph));
    }
    articles.append(details);
  }
  document.querySelector('#resources').hidden = false;
}

const id = new URLSearchParams(location.search).get('course');
const selected = courses.find(([courseId]) => courseId === id);
if (selected) {
  const [, name, category, tint] = selected;
  document.title = name + ' | Fivey';
  document.querySelector('#title').textContent = name;
  const tag = document.querySelector('#tag');
  tag.textContent = category;
  tag.style.setProperty('--tint', tint);
  tag.hidden = false;
  loadResources(id).catch(() => showStatus('Resources are temporarily unavailable. Try refreshing the page.'));
} else {
  document.querySelector('#title').textContent = 'Course not found';
  showStatus('Use All courses to choose a subject.');
}
</script>
</body>
</html>
