<!doctype html>
<html lang="en" class="fivey-auth-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbies Treasure Chest | Fivey</title>
  <script src="./theme.js?v=1"></script>
  <link rel="stylesheet" href="./brand.css?v=fb47b45">
  <link rel="stylesheet" href="./auth.css?v=magenta2">
  <link rel="stylesheet" href="./orbies-reward.css?v=3">
  <script type="module" src="./orbies-reward.js?v=3"></script>
<link rel="stylesheet" href="./site-footer.css?v=2">
</head>
<body class="reward-page" data-rarity="starting">
  <header>
    <div class="reward-bar">
      <a class="brand" href="./" aria-label="Fivey home"><span class="brand-number" aria-hidden="true">5</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span></a>
      <nav aria-label="Main navigation"><a href="./courses.html">Courses</a></nav>
    </div>
  </header>
  <main class="reward-main">
    <p id="reward-unavailable" hidden>This chest is unavailable. <a href="./courses.html">Browse courses</a> to start a practice set.</p>
    <section id="reward" aria-labelledby="reward-title" hidden>
      <h1 id="reward-title">You earned an Orbies chest!</h1>
      <div class="reward-stage">
        <p class="reward-stars" id="reward-stars" role="img" aria-label="1 out of 5 stars"></p>
        <button type="button" id="reward-chest" class="reward-chest">
          <span class="chest-shadow" aria-hidden="true"></span>
          <span class="chest-light" aria-hidden="true"></span>
          <span class="chest-sweep" aria-hidden="true"></span>
          <span class="chest-rotor" aria-hidden="true">
            <span class="chest-model">
              <span class="chest-base">
                <span class="chest-face chest-front"></span>
                <span class="chest-face chest-back"></span>
                <span class="chest-face chest-left"></span>
                <span class="chest-face chest-right"></span>
                <span class="chest-face chest-bottom"></span>
                <span class="chest-interior"></span>
              </span>
              <span class="chest-lid">
                <span class="chest-face chest-front"></span>
                <span class="chest-face chest-back"></span>
                <span class="chest-face chest-left"></span>
                <span class="chest-face chest-right"></span>
                <span class="chest-top"></span>
                <span class="chest-underside"></span>
                <span class="chest-lock"></span>
              </span>
            </span>
          </span>
          <span id="chest-prompt" class="chest-prompt">Click Me!</span>
        </button>
        <p id="reward-status" class="reward-status" role="status"></p>
      </div>
      <a class="reward-return" id="reward-return" href="./courses.html">Practice another set</a>
    </section>
  </main>
<footer class="fivey-site-footer">
  <nav aria-label="Footer navigation" class="fivey-site-footer-links">
    <a href="./about.html">About the Developer</a>
    <span class="fivey-blog-link">
      <a href="./blog.html" aria-describedby="fivey-blog-hint">Developer's Personal Blog</a>
      <span class="fivey-blog-hint" id="fivey-blog-hint" role="tooltip">Discover how the developer studied for the AP exams, and his past experiences!</span>
    </span>
  </nav>
</footer>
  <section class="reward-reveal" id="reward-reveal" aria-labelledby="reward-amount" hidden>
    <span class="reward-rays" aria-hidden="true"></span>
    <img src="./orbies-coin.png?v=1" alt="" width="240" height="240">
    <h2 id="reward-amount" tabindex="-1"></h2>
    <a class="reward-return" id="reward-reveal-return" href="./courses.html">Practice another set</a>
  </section>
</body>
</html>
