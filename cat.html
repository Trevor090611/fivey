<!doctype html>
<html lang="en" class="fivey-auth-pending" data-cat-page>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cat | Fivey</title>
  <script src="./theme.js?v=4"></script>
  <link rel="stylesheet" href="./brand.css">
  <link rel="stylesheet" href="./auth.css?v=magenta2">
  <link rel="stylesheet" href="./fivey-chat.css?v=16">
  <style>
    :root[data-cat-page] { color-scheme: dark; --cat-cyan: #62e7ff; --cat-muted: #b9c7cc; }
    * { box-sizing: border-box; }
    :root[data-cat-page] body { margin: 0; min-height: 100vh; overflow-x: clip; background: #000 !important; color: #f4fbff; font: 16px/1.55 "DM Sans", system-ui, sans-serif; }
    .cat-name-bar { width: min(1120px, calc(100% - 32px)); min-height: 70px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    :root[data-cat-page] header nav :is(.fivey-user-dropdown, .fivey-subjects ul) { border: 4px solid var(--cat-cyan) !important; background: #000 !important; }
    :root[data-cat-page] :is(.cat-name-page, .fivey-user-dropdown) :is(button, a.practice-button) {
      border: 3px solid var(--cat-cyan) !important; background-color: #000 !important;
      background-image: linear-gradient(var(--cat-cyan), var(--cat-cyan)) !important; color: #f4fbff !important;
    }
    :root[data-cat-page] :is(.cat-name-page, .fivey-user-dropdown) :is(button, a.practice-button):is(:hover, :focus-visible):not(:disabled) { color: #000 !important; }
    :root[data-cat-page] header nav .fivey-subjects li a { background: #000; color: #f4fbff; }
    :root[data-cat-page] header nav .fivey-subjects li a:is(:hover, :focus-visible) { background: var(--cat-cyan); color: #000; }
    .cat-name-page { width: min(1000px, calc(100% - 32px)); margin: clamp(24px, 5vw, 60px) auto; display: grid; gap: 20px; }
    .cat-banner, .cat-name-card { border: 3px solid var(--cat-cyan); border-radius: 18px; background: #000; }
    .cat-banner { display: grid; grid-template-columns: minmax(175px, 244px) minmax(0, 1fr); gap: clamp(16px, 3vw, 30px); align-items: center; }
    .cat-banner, .cat-name-card { padding: clamp(18px, 4vw, 36px); }
    .cat-portrait {
      --box-center: 45%;
      position: relative;
      min-width: 0;
      min-height: 214px;
      z-index: 1;
      border-radius: 16px;
      background: radial-gradient(ellipse at 60% 88%, #09272e, #000 70%);
      isolation: isolate;
    }
    .cat-portrait .grogy-cat {
      position: absolute;
      z-index: 1;
      left: var(--box-center);
      bottom: 55px;
      width: 96px;
      aspect-ratio: 260 / 278;
      translate: -50% 0;
      pointer-events: none;
    }
    .cat-portrait .grogy-cat[data-state="walking"][data-walk-direction="right"] { --facing: -1; }
    :root[data-cat-page] .cat-portrait #cat-pet {
      position: absolute;
      z-index: 3;
      left: var(--box-center);
      bottom: 55px;
      width: 96px;
      aspect-ratio: 260 / 278;
      translate: -50% 0 !important;
      margin: 0;
      padding: 0;
      border: 0 !important;
      background: none !important;
      box-shadow: none !important;
      border-radius: 35%;
      cursor: pointer;
    }
    #cat-pet[hidden] { display: none; }
    .cat-hearts { position: absolute; z-index: 4; left: calc(var(--box-center) - 22px); bottom: 132px; pointer-events: none; }
    .cat-heart { position: absolute; color: #ff699f; line-height: 1; text-shadow: 0 1px 7px #ff2e7677; opacity: 0; animation: cat-heart-rise 1.15s ease-out both; }
    .cat-heart:nth-child(1) { --heart-drift: -22px; font-size: 18px; }
    .cat-heart:nth-child(2) { --heart-drift: 4px; font-size: 26px; animation-delay: 90ms; }
    .cat-heart:nth-child(3) { --heart-drift: 32px; font-size: 20px; animation-delay: 180ms; }
    @keyframes cat-heart-rise {
      0% { opacity: 0; transform: translate(0, 0) scale(.55); }
      18% { opacity: 1; }
      72% { opacity: .95; }
      100% { opacity: 0; transform: translate(var(--heart-drift), -55px) scale(1.12); }
    }
    @keyframes cat-heart-fade {
      0%, 100% { opacity: 0; }
      25%, 75% { opacity: 1; }
    }
    .cat-portrait .grogy-cat .cat-tail { animation: none; }
    .cat-box-layer { position: absolute; left: var(--box-center); bottom: 8px; width: min(190px, 74%); height: 132px; translate: -50% 0; pointer-events: none; }
    .cat-box-layer span { position: absolute; inset: 0; }
    .cat-box-back { z-index: 0; }
    .cat-box-front { z-index: 2; }
    .cat-box-back .box-back-flap { background: linear-gradient(168deg, #ead1ac, #b78b57); clip-path: polygon(20% 16%, 64% 5%, 72% 37%, 28% 52%); }
    .cat-box-back .box-right-flap { background: linear-gradient(143deg, #e6c79b, #b68552); clip-path: polygon(70% 36%, 85% 10%, 100% 31%, 85% 56%); }
    .cat-box-back .box-inside { background: linear-gradient(174deg, #865c37, #4c311e 65%); clip-path: polygon(28% 50%, 70% 35%, 86% 55%, 32% 72%); }
    .cat-box-front .box-side { background: linear-gradient(115deg, #be8e5f, #92613d); clip-path: polygon(23% 55%, 37% 66%, 37% 95%, 24% 79%); }
    .cat-box-front .box-face { background: linear-gradient(154deg, #cb9e6d, #a97749 72%, #96643e); clip-path: polygon(37% 66%, 88% 51%, 85% 81%, 37% 95%); }
    .cat-box-front .box-left-flap { background: linear-gradient(132deg, #d8b084, #a7784e); clip-path: polygon(6% 36%, 28% 50%, 42% 66%, 19% 61%); }
    .cat-box-front .box-front-flap { background: linear-gradient(162deg, #ead1a8, #c8a078); clip-path: polygon(34% 63%, 86% 49%, 96% 50%, 43% 70%); }
    .cat-attachment h1 { margin: 0 0 16px; font-size: clamp(29px, 5vw, 46px); line-height: 1.08; overflow-wrap: anywhere; }
    .cat-attachment h2, .cat-name-card h2 { margin: 0 0 8px; color: var(--cat-cyan); font-size: 18px; }
    #cat-tier-label { margin: 0 0 8px; font-size: clamp(18px, 3vw, 25px); font-weight: 800; }
    #cat-tier-art { display: block; width: auto; max-width: 100%; max-height: 120px; object-fit: contain; margin: 0 0 10px; }
    #cat-tier-art[hidden] { display: none; }
    #cat-xp-bar { display: block; width: 100%; height: 14px; accent-color: var(--cat-cyan); }
    #cat-xp-label, #cat-name-help { color: var(--cat-muted); font-size: 14px; }
    #cat-xp-label { margin: 6px 0 14px; }
    .cat-name-card form { display: grid; gap: 8px; max-width: 480px; }
    .cat-name-card input { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--cat-cyan); border-radius: 6px; background: #000; color: #f4fbff; font: inherit; }
    .cat-name-page button { width: fit-content; min-height: 44px; padding: 8px 14px; border-radius: 8px; font: inherit; font-weight: 750; }
    .cat-name-page button:disabled { opacity: .65; cursor: not-allowed; }
    .cat-name-page :focus-visible { outline: 3px solid var(--cat-cyan); outline-offset: 3px; }
    .cat-name-page p[role="status"] { margin: 0; }
    .cat-name-page p[role="status"]:not(:empty) { margin-top: 10px; }
    @media (max-width: 600px) {
      .cat-banner { grid-template-columns: minmax(0, 1fr); }
      .cat-portrait .grogy-cat, :root[data-cat-page] .cat-portrait #cat-pet { width: 76px; }
      .cat-hearts { bottom: 115px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cat-portrait .grogy-cat :is(.cat-lid, .cat-lash) { animation: none !important; }
      .cat-portrait .grogy-cat .cat-head { transition: none; }
      .cat-heart { animation-name: cat-heart-fade; animation-duration: 700ms; translate: var(--heart-drift) -12px; }
    }
  </style>
</head>
<body>
  <p id="fivey-access-status" role="status">Checking Fivey sign-in… <a href="./login.html">Go to login</a></p>
  <header>
    <div class="cat-name-bar">
      <a class="brand" href="./" aria-label="Fivey home"><span class="brand-number" aria-hidden="true">5</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span><span class="brand-bill" aria-hidden="true">$</span></a>
      <nav aria-label="Main navigation"></nav>
    </div>
  </header>
  <main class="cat-name-page">
    <section class="cat-name-card" aria-labelledby="cat-rename-heading">
      <h2 id="cat-rename-heading">Rename your cat</h2>
      <form id="cat-name-form">
        <label for="cat-name">Cat’s name</label>
        <input id="cat-name" type="text" value="Grogy" maxlength="10" aria-describedby="cat-name-help" autocomplete="off" required disabled>
        <span id="cat-name-help" aria-live="polite">5/10</span>
        <button class="practice-button" type="submit" disabled>Save name</button>
      </form>
      <p id="cat-name-status" role="status"></p>
    </section>
    <section class="cat-banner" aria-labelledby="cat-name-title">
      <div class="cat-portrait">
        <div class="cat-box-layer cat-box-back" aria-hidden="true">
          <span class="box-back-flap"></span><span class="box-right-flap"></span><span class="box-inside"></span>
        </div>
        <div class="grogy-cat" id="cat-portrait" data-state="idle" aria-hidden="true" hidden></div>
        <div class="cat-box-layer cat-box-front" aria-hidden="true">
          <span class="box-side"></span><span class="box-face"></span><span class="box-left-flap"></span><span class="box-front-flap"></span>
        </div>
        <button id="cat-pet" type="button" aria-label="Pet Grogy" hidden></button>
        <div class="cat-hearts" aria-hidden="true"></div>
      </div>
      <div class="cat-attachment">
        <h1 id="cat-name-title">Grogy the Cat</h1>
        <h2 id="cat-attachment-heading">Level of Attachment</h2>
        <p id="cat-tier-label">Tier 1 · Stranger</p>
        <img id="cat-tier-art" alt="" hidden>
        <progress id="cat-xp-bar" max="100" value="0" aria-labelledby="cat-attachment-heading" aria-describedby="cat-xp-label"></progress>
        <p id="cat-xp-label">0 / 100 EXP to Wary</p>
        <button class="practice-button" id="cat-feed" type="button" disabled>Feed Grogy</button>
        <p id="cat-feed-status" role="status"></p>
      </div>
    </section>
  </main>
  <script type="module">
    import { authenticatedClient } from './auth-gate.js?v=cat-name1';
    import { catMarkup } from './grogy-cat.js';

    const tiers = ['Stranger', 'Wary', 'Curious', 'Familiar', 'Comfort', 'Companion',
      'Affectionate', 'Buddy Buddy :)', 'Best Friends :D', 'Inseparable'];
    const requirements = tiers.slice(0, -1).map((_, index) => Math.ceil(100 * 2.5 ** index));
    const maxXP = requirements.reduce((total, cost) => total + cost, 0);
    const feedXP = 25;
    const xpKey = 'fivey_cat_attachment_xp';
    // Add image URLs here by tier number as artwork becomes available.
    const tierArtwork = {};
    const format = new Intl.NumberFormat();
    const portrait = document.querySelector('#cat-portrait');
    const tierLabel = document.querySelector('#cat-tier-label');
    const artwork = document.querySelector('#cat-tier-art');
    const bar = document.querySelector('#cat-xp-bar');
    const xpLabel = document.querySelector('#cat-xp-label');
    const feed = document.querySelector('#cat-feed');
    const feedStatus = document.querySelector('#cat-feed-status');
    const nameInput = document.querySelector('#cat-name');
    const nameCount = document.querySelector('#cat-name-help');
    const nameTitle = document.querySelector('#cat-name-title');
    const pet = document.querySelector('#cat-pet');
    const hearts = document.querySelector('.cat-hearts');
    let totalXP = 0;
    let saving = false;

    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const walkSpeed = 47; // Match the roaming cat's walking pace in pixels per second.
    const sleepDelay = 60_000;
    let entrance;
    let sleepTimer;
    let groomTimer;

    function updateNameCount() {
      nameCount.textContent = nameInput.value.length + '/' + nameInput.maxLength;
    }

    function updateNameLabels() {
      const name = nameTitle.textContent.replace(/ the Cat$/, '');
      feed.textContent = saving ? 'Feeding…' : 'Feed ' + name;
      pet.setAttribute('aria-label', 'Pet ' + name);
    }

    nameInput.addEventListener('input', updateNameCount);
    new MutationObserver(() => {
      updateNameCount();
      updateNameLabels();
    }).observe(nameTitle, { childList: true, characterData: true, subtree: true });
    updateNameCount();
    updateNameLabels();

    const petCooldown = 2000;
    let lastPet = -Infinity;
    pet.addEventListener('click', () => {
      const now = performance.now();
      if (pet.hidden || now - lastPet < petCooldown) return;
      lastPet = now;
      const burst = document.createDocumentFragment();
      for (let i = 0; i < 3; i++) {
        const heart = document.createElement('span');
        heart.className = 'cat-heart';
        heart.textContent = '♥';
        heart.addEventListener('animationend', () => heart.remove(), { once: true });
        burst.append(heart);
      }
      hearts.replaceChildren(burst);
    });

    function resetSleepTimer() {
      clearTimeout(sleepTimer);
      if (portrait.dataset.state === 'sleeping') portrait.dataset.state = 'idle';
      sleepTimer = setTimeout(() => {
        clearTimeout(groomTimer);
        portrait.dataset.state = 'sleeping';
      }, sleepDelay);
    }

    function entranceOffset(destination) {
      let position = { right: 16, bottom: 16 };
      try {
        const saved = JSON.parse(localStorage.getItem('grogy-cat-position-v1'));
        if (Number.isFinite(saved?.right) && Number.isFinite(saved?.bottom)) position = saved;
      } catch {
        // Use the roaming cat's default corner when storage is unavailable.
      }
      const margin = 8;
      const right = Math.min(Math.max(position.right, margin), Math.max(margin, innerWidth - destination.width - margin));
      const bottom = Math.min(Math.max(position.bottom, margin), Math.max(margin, innerHeight - destination.height - margin));
      return {
        x: innerWidth - destination.width - right - destination.left,
        y: innerHeight - destination.height - bottom - destination.top
      };
    }

    function startCatScene() {
      entrance?.cancel();
      clearTimeout(groomTimer);
      portrait.hidden = false;
      portrait.dataset.state = 'idle';
      pet.hidden = false;
      resetSleepTimer();
      if (reducedMotion.matches) return;

      const { x, y } = entranceOffset(portrait.getBoundingClientRect());
      const pathLength = Math.hypot(x, y);
      if (pathLength < 1) return;
      portrait.dataset.walkDirection = x < 0 ? 'right' : 'left';
      portrait.dataset.state = 'walking';
      pet.hidden = true;
      entrance = portrait.animate([
        { transform: 'translate(' + x + 'px, ' + y + 'px)' },
        { transform: 'translate(0, 0)' }
      ], { duration: pathLength / walkSpeed * 1000, easing: 'linear' });
      entrance.onfinish = () => {
        pet.hidden = false;
        if (portrait.dataset.state === 'walking') portrait.dataset.state = 'idle';
      };
    }

    portrait.innerHTML = catMarkup;
    portrait.querySelector('.cat-walker img').decode().catch(() => {}).then(startCatScene);
    window.addEventListener('pageshow', event => {
      if (event.persisted) startCatScene();
    });
    for (const event of ['pointerdown', 'keydown', 'click', 'wheel']) {
      document.addEventListener(event, resetSleepTimer, { capture: true, passive: true });
    }
    setInterval(() => {
      if (reducedMotion.matches || document.hidden || portrait.hidden || portrait.dataset.state !== 'idle') return;
      portrait.dataset.state = 'grooming';
      groomTimer = setTimeout(() => { portrait.dataset.state = 'idle'; }, 2600);
    }, 12000);

    function savedXP(user) {
      const xp = user?.user_metadata?.[xpKey];
      return Number.isSafeInteger(xp) ? Math.max(0, Math.min(xp, maxXP)) : 0;
    }

    function progress(total) {
      let xp = total;
      let index = 0;
      while (index < requirements.length && xp >= requirements[index]) {
        xp -= requirements[index];
        index++;
      }
      return { index, xp, target: requirements[index] };
    }

    const auth = authenticatedClient?.auth;
    function paint() {
      const { index, xp, target } = progress(totalXP);
      tierLabel.textContent = 'Tier ' + (index + 1) + ' · ' + tiers[index];
      const image = tierArtwork[index + 1];
      if (image) artwork.src = image;
      else artwork.removeAttribute('src');
      artwork.hidden = !image;
      bar.max = target || 1;
      bar.value = target ? xp : 1;
      xpLabel.textContent = target ? format.format(xp) + ' / ' + format.format(target) + ' EXP to ' + tiers[index + 1] : 'Maximum attachment reached';
      feed.disabled = !auth || saving || !target;
      updateNameLabels();
    }

    async function currentUser() {
      const { data, error } = await auth.getUser();
      if (error || !data?.user) throw error || new Error('Missing account');
      return data.user;
    }

    async function feedCat() {
      const user = await currentUser();
      const previousXP = savedXP(user);
      const nextXP = Math.min(previousXP + feedXP, maxXP);
      if (nextXP === previousXP) {
        totalXP = previousXP;
        feedStatus.textContent = 'Maximum attachment reached.';
        return;
      }
      const { data, error } = await auth.updateUser({ data: { [xpKey]: nextXP } });
      if (error || !data?.user) throw error || new Error('Missing updated account');
      totalXP = savedXP(data.user);
      const { index } = progress(totalXP);
      const earned = '+' + (totalXP - previousXP) + ' EXP.';
      feedStatus.textContent = index > progress(previousXP).index ? earned + ' Reached ' + tiers[index] + '!' : earned;
    }

    if (auth) {
      try {
        totalXP = savedXP(await currentUser());
      } catch {
        feedStatus.textContent = 'Could not load attachment progress. Feeding will try again.';
      }
      feed.addEventListener('click', async () => {
        if (saving || totalXP === maxXP) return;
        saving = true;
        feedStatus.textContent = '';
        paint();
        try {
          if (navigator.locks) await navigator.locks.request(xpKey, feedCat);
          else await feedCat();
        } catch {
          feedStatus.textContent = 'Could not save the feeding. Please try again.';
        } finally {
          saving = false;
          paint();
        }
      });
    }
    paint();
  </script>
</body>
</html>
